name: CI

on:
    pull_request: {}
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    rust:
        name: Rust
        uses: RustForWeb/.github/.github/workflows/rust.yml@300f79f742e86d4653d44a17864e89297a7025cf # v1.0.2
        with:
            enable-test: false
            target: wasm32-unknown-unknown
