name: CI

on:
    pull_request: {}
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    rust:
        name: Rust
        uses: RustForWeb/.github/.github/workflows/rust.yml@8a0ce4333fd134d177f151cba9b768f041f43601 # v1.0.3
        with:
            enable-test: false
            target: wasm32-unknown-unknown
