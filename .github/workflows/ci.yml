name: CI

on:
    pull_request: {}
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    rust:
        name: Rust
        uses: RustForWeb/.github/.github/workflows/rust.yml@a274809f14e1aa38ab083978e1e3f2d2a8e58d29 # v1.0.4
        with:
            enable-test: false
            target: wasm32-unknown-unknown
