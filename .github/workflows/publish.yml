name: Publish

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write
    packages: write

jobs:
    publish:
        name: Publish
        uses: RustForWeb/.github/.github/workflows/publish.yml@a274809f14e1aa38ab083978e1e3f2d2a8e58d29 # v1.0.4
        with:
            enable-rust: true
            enable-typescript: false
            
            target: wasm32-unknown-unknown
